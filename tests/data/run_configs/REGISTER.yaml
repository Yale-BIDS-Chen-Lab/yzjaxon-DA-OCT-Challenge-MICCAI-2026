# Every difference between the recipes (configs/reproduction/model_*/**.yaml, resolved) and the normalised
# configs of the eight Final training runs (tests/data/run_configs/<run>.json).
# tests/test_recipes.py enforces it; a batch that changes a recipe adds or edits an entry here
# in the same commit, and one that removes a difference removes its entry.
#
# Rule: a key present on both sides must be equal unless an entry says CHANGED (both values
# pinned); a recipe-only key needs an ADDED entry (recipe value pinned); a snapshot-only key
# needs a REMOVED entry (snapshot value pinned; tag no_reader, off_value or server_overridden).
# `path` covers the key itself and every key below it. `runs` is `all` or a list of run names.
# In pinned string values `<L>` stands for the run's lineage (s33 or s34).
#
# Tags:
#   no_reader          nothing reads the key from a recipe or from a checkpoint config; the
#                      entry's scan records the search behind that claim (a record, not re-run
#                      by the tests)
#   guard_only         read only by a start-up refusal; what the run loads and trains on is
#                      unchanged (the scan's allow list names the check)
#   argv               the run took the value from its launcher's command line, not from the
#                      recipe; tests/test_recipes.py runs the launcher and compares
#   live               a code path reads the value; `fix` names the batch that removes the
#                      difference. Never part of configs/published_pair.json:retrained_register
#   off_value, server_overridden (REMOVED only): the removed key held its feature's off value,
#                      or the server assembler overwrites it before any reader sees it
#   decision           an owner decision changed the recipe on purpose; `why` names it
#
# Which of these may differ in a retrained export: every entry that applies to s33_coteach
# (model A) or s34_cnn (model B) and is not `live` is listed, as `config.<path>`, in
# configs/published_pair.json:retrained_register (asserted by tests/test_recipes.py).
schema: octtta/recipe_register/1

scans:
  fusion_selection_block:
    pattern: fusion_selection
    allow:
      octtta/fusion.py: a message label ('fusion_selection.margin') in pick_block's argument check
      scripts/entrypoint/train.sh: state-file names (the constants are in scripts/entrypoint/budget.sh)
      scripts/entrypoint/infer.sh: state-file names (the constants are in scripts/entrypoint/budget.sh)
      scripts/entrypoint/fusion_select.py: help text naming the state file fusion_selection.json
      submission/preflight.py: reads the state file fusion_selection.json after the package run
  quoted_gpu:
    pattern: '["'']gpu["'']'
    allow:
      octtta/runenv_status.py: the runtime record's own 'gpu' field
      submission/preflight.py: the GPU of configs/expected.json inputs.quick_reference and of the host
      scripts/repro.py: Reads configs/local.yaml slurm.gpu for the reproduction launcher; unrelated to
        trimmed config.server_budget.gpu.
  quoted_slurm:
    pattern: '["'']slurm["'']'
    allow:
      octtta/train_state.py: CONFIG_VOLATILE_KEYS, the subtrees left out of the resume fingerprint
      scripts/repro.py: Reads configs/local.yaml scheduler settings for reproduction; it does not read
        removed recipe slurm values.
  ignore_on_disk:
    pattern: ignore_on_disk
    allow:
      octtta/train_data.py: legacy off-value validation, if present
  b11_data_infer_at_native_resolution:
    pattern: data\.infer_at_native_resolution
    allow: {}
  b11_data_labeled_device:
    pattern: data\.labeled_device
    allow: {}
  b11_eval_metric:
    pattern: eval\.metric(?![A-Za-z0-9_])
    allow: {}
  b11_eval_report_per_class:
    pattern: eval\.report_per_class
    allow: {}
  b11_eval_report_per_vendor:
    pattern: eval\.report_per_vendor
    allow: {}
  b11_model_source:
    pattern: model\.source
    allow: {}
  b11_server_budget_hard_stop_margin:
    pattern: server_budget\.hard_stop_margin
    allow: {}
  b11_server_budget_max_train_seconds:
    pattern: server_budget\.max_train_seconds
    allow: {}
  b11_server_budget_presubmission_seconds:
    pattern: server_budget\.presubmission_seconds
    allow: {}
  b11_server_budget_reserve_for_census:
    pattern: server_budget\.reserve_for_census
    allow: {}
  b11_server_budget_reserve_for_io:
    pattern: server_budget\.reserve_for_io
    allow: {}
  b11_server_budget_total_seconds:
    pattern: server_budget\.total_seconds
    allow: {}
  b11_train_name:
    pattern: train\.name
    allow: {}
entries:
- path: data.partial_pool.ignore_on_disk
  kind: ADDED
  runs: all
  recipe:
  - aireadi_inner::Heidelberg_Spectralis
  - aireadi_inner::Topcon_Maestro2
  - aireadi_inner::Topcon_Triton
  - aireadi_inner::Zeiss_Cirrus
  tag: guard_only
  scan: ignore_on_disk
  batch: B11
  why: 'Only the four on-disk inner pools not selected for training remain excused. The four aireadi::
    entries are already selected by data.partial_pool.datasets. The startup check may refuse unexpected
    on-disk pools; the trained dataset is unchanged, and server assembly replaces data.partial_pool before
    its trainer.'
- path: train.finetune_from
  kind: CHANGED
  runs:
  - s33_coteach
  - s34_coteach
  snapshot: ${OCTTTA_SCRATCH}/oct_tta_runs/<L>_sam_phase2/checkpoints/best.pt
  recipe: null
  tag: argv
  batch: a5da238
  why: The co-teaching warm starts come from scripts/train/coteach.sbatch (train.finetune_from=<runs>/<L>_sam_phase2/checkpoints/last.pt,
    --finetune-from-b <runs>/<L>_cnn/checkpoints/last.pt); B8 fixed epochs make last.pt the product corresponding
    to the historical selected checkpoint. The recipe leaves the key null; the server assembler pops it.
