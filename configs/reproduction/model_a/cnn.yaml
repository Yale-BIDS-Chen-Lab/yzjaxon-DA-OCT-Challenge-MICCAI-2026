data:
  root: ${OCTTTA_DATA}/synthetic_v1.0/release_dataset
  num_classes: 10
  unlabeled_devices:
  - Topcon_Maestro2_unlabeled
  - Heidelberg_Spectralis
  - Zeiss_Cirrus
  oversample_diseased: 2.0
  train_size:
  - 256
  - 256
  crop:
    foreground_prob: 0.6
    foreground_classes: null
    augment_margin: auto
  partial_pool:
    enabled: true
    root: ${OCTTTA_DATA}/derived/partial_all16_d88
    datasets:
    - duke_dme_2015
    - jhu_hcms
    - oct5k
    - aireadi::Heidelberg_Spectralis
    - aireadi::Topcon_Maestro2
    - aireadi::Topcon_Triton
    - aireadi::Zeiss_Cirrus
    ignore_on_disk:
    - aireadi_inner::Heidelberg_Spectralis
    - aireadi_inner::Topcon_Maestro2
    - aireadi_inner::Topcon_Triton
    - aireadi_inner::Zeiss_Cirrus
    graders:
    - 1
    official_share: null
    samples_per_epoch: 29000
    sampling: cover
    cover_epoch_offset: 0
    cell_balance:
      mode: identity
    exclude_cells: []
  official_true_boundaries_only: true
  official_synthetic_boundary_map: gamma
  split:
    scheme: hash_by_stem
    val_fraction: 0.2
    seed: 20260725
  normalize:
    mode: per_image_zscore
    clip_percentiles:
    - 0.5
    - 99.5
  loader:
    batch_size: 8
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  pool_entries:
  - challenge_release_synthetic
  - public_partial_labels_all16_d88
runtime:
  seed: 20260733
  deterministic: true
  cudnn_benchmark: false
  device: cuda
  amp: true
  amp_dtype: bfloat16
  channels_last: false
  compile: false
  out_dir: ${OCTTTA_RUNS}
  ckpt_dir: ${OCTTTA_CKPT}
  log_every: 50
  val_every_epochs: 25
server_budget:
  reserve_for_inference: 1200
inference:
  mode: sliding_window
  overlap: 0.6875
  patch_size:
  - 256
  - 256
train:
  epochs: 30
  stop_epoch: 25
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.0001
  scheduler:
    name: poly
    power: 0.9
    warmup_epochs: 2
  grad_clip: 12.0
  ema:
    enabled: true
    decay: 0.999
  consistency:
    enabled: true
    weight_dirty: 0.5
    weight_kl: 0.5
    p: 1.0
    extreme_frac: 0.1666
    aband:
      blur_sigma:
      - 2.0
      - 12.0
      blur_sigma_extreme:
      - 12.0
      - 18.0
      noise_sigma:
      - 0.5
      - 3.0
      noise_sigma_extreme:
      - 3.0
      - 5.0
      contrast_loss:
      - 0.5
      - 1.0
      contrast_loss_extreme:
      - 1.0
      - 1.0
      attenuation:
      - 0.1
      - 0.7
      attenuation_extreme:
      - 0.03
      - 0.1
      patch_amp:
      - 0.8
      - 3.5
      patch_amp_extreme:
      - 3.5
      - 5.0
loss:
  terms:
  - name: cross_entropy
    weight: 1.0
    class_weights: auto_inverse_sqrt_freq
  - name: dice
    weight: 1.0
    include_background: true
  - name: boundary
    weight: 0.5
    warmup_epochs: 20
  deep_supervision:
    enabled: true
    weights:
    - 1.0
    - 0.5
    - 0.25
    - 0.125
augment:
  vertical_flip: false
  horizontal_flip: true
  pipeline:
  - name: random_scale
    range:
    - 0.75
    - 1.35
    axis: both
    p: 0.5
  - name: random_anisotropic_scale
    axial:
    - 0.7
    - 1.4
    lateral:
    - 0.8
    - 1.25
    p: 0.4
  - name: random_rotate
    degrees: 8
    p: 0.3
  - name: random_translate
    frac: 0.1
    p: 0.3
  - name: elastic
    alpha: 25
    sigma: 6
    p: 0.2
  - name: gamma
    range:
    - 0.6
    - 1.7
    p: 0.5
  - name: brightness_contrast
    brightness: 0.25
    contrast: 0.3
    p: 0.5
  - name: gaussian_noise
    sigma:
    - 0
    - 0.12
    p: 0.35
  - name: speckle_noise
    sigma:
    - 0
    - 0.15
    p: 0.35
  - name: gaussian_blur
    sigma:
    - 0
    - 1.2
    p: 0.25
  - name: sharpen
    p: 0.15
  - name: low_res_simulation
    scale:
    - 0.5
    - 1.0
    p: 0.25
postproc:
  enforce_monotonic_columns: true
  allow_class_skips: true
  remove_small_islands: false
  min_island_frac: 0.0001
  min_island_floor: 2
  presence_gate:
    enabled: true
    min_pixel_frac: 0.0005
    min_pixels_floor: 32
    min_mean_conf: 0.5
    protected_classes:
    - 0
    - 9
  never_invent_classes: true
  enabled: false
eval:
  tune_select_metric: none
  tta: false
model:
  name: nnunet2d
  params:
    in_channels: 1
    out_channels: 10
    n_stages: 7
    features_per_stage:
    - 32
    - 64
    - 128
    - 256
    - 512
    - 512
    - 512
    kernel_sizes:
    - - 3
      - 3
    - - 3
      - 3
    - - 3
      - 3
    - - 3
      - 3
    - - 3
      - 3
    - - 3
      - 3
    - - 3
      - 3
    strides:
    - - 1
      - 1
    - - 2
      - 2
    - - 2
      - 2
    - - 2
      - 2
    - - 2
      - 2
    - - 2
      - 2
    - - 2
      - 2
    n_conv_per_stage:
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    n_conv_per_stage_decoder:
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    norm: instance
    nonlin: leakyrelu
    deep_supervision: true
experiment:
  id: s33_cnn
