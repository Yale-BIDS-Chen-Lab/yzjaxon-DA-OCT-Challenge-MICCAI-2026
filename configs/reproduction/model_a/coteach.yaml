data:
  root: ${OCTTTA_DATA}/synthetic_v1.0/release_dataset
  num_classes: 10
  unlabeled_devices:
  - Topcon_Maestro2_unlabeled
  - Heidelberg_Spectralis
  - Zeiss_Cirrus
  oversample_diseased: 2.0
  train_size:
  - 256
  - 256
  crop:
    foreground_prob: 0.6
    foreground_classes: null
    augment_margin: auto
  partial_pool:
    enabled: true
    root: ${OCTTTA_DATA}/derived/partial_all16_d88
    datasets:
    - duke_dme_2015
    - jhu_hcms
    - oct5k
    - aireadi::Heidelberg_Spectralis
    - aireadi::Topcon_Maestro2
    - aireadi::Topcon_Triton
    - aireadi::Zeiss_Cirrus
    ignore_on_disk:
    - aireadi_inner::Heidelberg_Spectralis
    - aireadi_inner::Topcon_Maestro2
    - aireadi_inner::Topcon_Triton
    - aireadi_inner::Zeiss_Cirrus
    graders:
    - 1
    official_share: null
    samples_per_epoch: unlabeled_pass
    sampling: cover
    cover_epoch_offset: 0
    cell_balance:
      mode: identity
    exclude_cells: []
    frame_cap:
      Zeiss_Cirrus|Optic Disc, 6 x 6: 4
  official_true_boundaries_only: true
  official_synthetic_boundary_map: gamma
  split:
    scheme: group_by_content
    val_fraction: 0.2
    seed: 20260818
  normalize:
    mode: per_image_zscore
    clip_percentiles:
    - 0.5
    - 99.5
  loader:
    batch_size: 8
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  pool_entries:
  - challenge_release_synthetic
  - public_partial_labels_all16_d88
  - unlabeled_local_all_d88
  unlabeled_roots:
  - ${OCTTTA_DATA}/derived/unlabeled_all_d88
  unlabeled_groups: null
runtime:
  seed: 20260733
  deterministic: true
  cudnn_benchmark: false
  device: cuda
  amp: true
  amp_dtype: bfloat16
  channels_last: false
  compile: false
  out_dir: ${OCTTTA_RUNS}
  ckpt_dir: ${OCTTTA_CKPT}
  log_every: 50
  val_every_epochs: 25
  monitor: challenge_score
  monitor_mode: max
server_budget:
  reserve_for_inference: 1200
inference:
  mode: sliding_window
  overlap: 0.6875
  patch_size:
  - 256
  - 256
  max_height: null
train:
  epochs: 1
  optimizer:
    name: adamw
    lr: 3.0e-05
    weight_decay: 0.0001
  scheduler:
    name: poly
    power: 0.9
    warmup_epochs: 0
  grad_clip: 12.0
  ema:
    enabled: true
    decay: 0.999
  finetune:
    phase: 2
    enc_lr: 3.0e-06
    dec_lr: 3.0e-05
    layer_decay: 0.8
    unfreeze_last_blocks: 24
  consistency:
    enabled: true
    weight_dirty: 0.5
    weight_kl: 0.5
    p: 1.0
    extreme_frac: 0.1666
    aband:
      blur_sigma:
      - 2.0
      - 12.0
      blur_sigma_extreme:
      - 12.0
      - 18.0
      noise_sigma:
      - 0.5
      - 3.0
      noise_sigma_extreme:
      - 3.0
      - 5.0
      contrast_loss:
      - 0.5
      - 1.0
      contrast_loss_extreme:
      - 1.0
      - 1.0
      attenuation:
      - 0.1
      - 0.7
      attenuation_extreme:
      - 0.03
      - 0.1
      patch_amp:
      - 0.8
      - 3.5
      patch_amp_extreme:
      - 3.5
      - 5.0
  finetune_from: null
  interval_share_penalty:
    weight: 1.0
    max_share: 0.6
  coteach:
    enabled: true
    teacher: ema
    teacher_decay: null
    target: cross
    weight: 0.5
    every: 1
    batch_size: 8
    quantile: 0.5
    weight_floor: 0.3
    structure_discount: 0.3
    agree_min: null
    hard_shapes: null
    scope_b: full
    freeze_norm_affine_b: false
    lr_b: 1.0e-05
    include_maestro2_unlabeled: true
    include_release_unlabeled: false
    assert_full_pass: true
    full_pass_remainder:
      allow: true
      max_frames: 7
    gate: dmt
    dmt:
      delta_px: 3.0
      tau_high: 0.8
      tau_mid: 0.8
      delta_q: 1.0
      gamma: 3.0
      band_rows: 3
      disqualify_crossing: true
      thickness: null
    weight_ramp_steps: 300
    teacher_temp_a: 1.0
    teacher_temp_b: 1.0
loss:
  terms:
  - name: cross_entropy
    weight: 1.0
    class_weights: auto_inverse_sqrt_freq
  - name: dice
    weight: 1.0
    include_background: true
  - name: boundary
    weight: 0.2
    warmup_epochs: 20
  deep_supervision:
    enabled: true
    weights:
    - 1.0
    - 0.5
    - 0.25
    - 0.125
augment:
  vertical_flip: false
  horizontal_flip: true
  pipeline:
  - name: random_scale
    range:
    - 0.75
    - 1.35
    axis: both
    p: 0.5
  - name: random_anisotropic_scale
    axial:
    - 0.7
    - 1.4
    lateral:
    - 0.8
    - 1.25
    p: 0.4
  - name: random_rotate
    degrees: 8
    p: 0.3
  - name: random_translate
    frac: 0.1
    p: 0.3
  - name: elastic
    alpha: 25
    sigma: 6
    p: 0.2
  - name: gamma
    range:
    - 0.6
    - 1.7
    p: 0.5
  - name: brightness_contrast
    brightness: 0.25
    contrast: 0.3
    p: 0.5
  - name: gaussian_noise
    sigma:
    - 0
    - 0.12
    p: 0.35
  - name: speckle_noise
    sigma:
    - 0
    - 0.15
    p: 0.35
  - name: gaussian_blur
    sigma:
    - 0
    - 1.2
    p: 0.25
  - name: sharpen
    p: 0.15
  - name: low_res_simulation
    scale:
    - 0.5
    - 1.0
    p: 0.25
postproc:
  enforce_monotonic_columns: true
  allow_class_skips: true
  remove_small_islands: false
  min_island_frac: 0.0001
  min_island_floor: 2
  presence_gate:
    enabled: true
    min_pixel_frac: 0.0005
    min_pixels_floor: 32
    min_mean_conf: 0.5
    protected_classes:
    - 0
    - 9
  never_invent_classes: true
eval:
  tune_select_metric: none
  fast_every: 4
  fast_max_images: 24
  select_on_fast: false
  postproc_gate_topology: 0.2
  pseudo_widefield:
    enabled: true
    width_scale: 2.5
    vignette: 0.5
    drop_peripheral_layers: true
    seed: 0
model:
  name: vit_fpn
  params:
    backbone: samvit_large_patch16.sa1b
    patch_size: 16
    in_channels: 1
    out_channels: 10
    indices:
    - 5
    - 11
    - 17
    - 23
    dim: 256
    encoder_weights: null
    pretrained: false
    deep_supervision: true
    encoder_window_size: 16
experiment:
  id: s33_coteach
failaug:
  enabled: true
  mode: gwarp
  p: 0.3
  extreme_frac: 0.1666
  gwarp:
    shift_frac:
    - 0.04
    - 0.3
    shift_frac_extreme:
    - 0.3
    - 0.45
    squeeze_frac:
    - 0.03
    - 0.2
    squeeze_frac_extreme:
    - 0.2
    - 0.3
fusion:
  enabled: true
  alpha_table:
    macula:
    - 0.35
    - 0.35
    - 0.35
    - 0.35
    - 0.35
    - 0.35
    - 0.35
    - 0.35
    - 0.35
    maestro2_wide:
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    spectralis_wide:
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    triton_12x12:
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
  shape_rules:
    maestro2_wide:
      height_min: 860
      height_max: 910
      width_min: 480
    spectralis_wide:
      height_min: 480
      height_max: 520
      width_min: 700
    triton_12x12:
      height_min: 980
      height_max: 1000
      width_min: 480
  qc:
    enabled: false
    unordered_frac_max: 0.05
    fragmented_frac_max: 0.05
    spike_max: 0.15
    thickness_frac_max: 0.25
    thickness_ratio: 3.0
    thickness_floor_px: 1.0
    median_window: 15
    edge_frac: 0.08
    alpha_when_a_trips: 0.1
    alpha_when_b_trips: 0.9
  column_switch:
    enabled: false
    tau: 0.04
    alpha_win: 0.9
    smooth_cols: 9
