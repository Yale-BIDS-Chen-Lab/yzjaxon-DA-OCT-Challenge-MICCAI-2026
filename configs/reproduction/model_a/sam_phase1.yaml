data:
  root: ${OCTTTA_DATA}/synthetic_v1.0/release_dataset
  num_classes: 10
  unlabeled_devices:
  - Topcon_Maestro2_unlabeled
  - Heidelberg_Spectralis
  - Zeiss_Cirrus
  oversample_diseased: 2.0
  train_size:
  - 256
  - 256
  crop:
    foreground_prob: 0.6
    foreground_classes: null
    augment_margin: auto
  partial_pool:
    enabled: true
    root: ${OCTTTA_DATA}/derived/partial_all16_d88
    datasets:
    - duke_dme_2015
    - jhu_hcms
    - oct5k
    - aireadi::Heidelberg_Spectralis
    - aireadi::Topcon_Maestro2
    - aireadi::Topcon_Triton
    - aireadi::Zeiss_Cirrus
    ignore_on_disk:
    - aireadi_inner::Heidelberg_Spectralis
    - aireadi_inner::Topcon_Maestro2
    - aireadi_inner::Topcon_Triton
    - aireadi_inner::Zeiss_Cirrus
    graders:
    - 1
    official_share: null
    samples_per_epoch: 29000
    sampling: cover
    cover_epoch_offset: 0
    cell_balance:
      mode: identity
    exclude_cells: []
    frame_cap:
      Zeiss_Cirrus|Optic Disc, 6 x 6: 4
  official_true_boundaries_only: true
  official_synthetic_boundary_map: gamma
  split:
    scheme: group_by_content
    val_fraction: 0.2
    seed: 20260818
  normalize:
    mode: per_image_zscore
    clip_percentiles:
    - 0.5
    - 99.5
  loader:
    batch_size: 8
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  pool_entries:
  - challenge_release_synthetic
  - public_partial_labels_all16_d88
runtime:
  seed: 20260733
  deterministic: true
  cudnn_benchmark: false
  device: cuda
  amp: true
  amp_dtype: bfloat16
  channels_last: false
  compile: false
  out_dir: ${OCTTTA_RUNS}
  ckpt_dir: ${OCTTTA_CKPT}
  log_every: 50
  val_every_epochs: 25
server_budget:
  reserve_for_inference: 1200
inference:
  mode: sliding_window
  overlap: 0.6875
  patch_size:
  - 256
  - 256
  max_height: 368
train:
  epochs: 3
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
  scheduler:
    name: poly
    power: 0.9
    warmup_epochs: 1
  grad_clip: 12.0
  ema:
    enabled: true
    decay: 0.999
  finetune:
    phase: 1
    enc_lr: 1.0e-05
    dec_lr: 0.0001
    layer_decay: 0.8
    unfreeze_last_blocks: 4
  consistency:
    enabled: false
  interval_share_penalty:
    weight: 1.0
    max_share: 0.6
loss:
  terms:
  - name: cross_entropy
    weight: 1.0
    class_weights: auto_inverse_sqrt_freq
  - name: dice
    weight: 1.0
    include_background: true
  - name: boundary
    weight: 0.2
    warmup_epochs: 5
  deep_supervision:
    enabled: true
    weights:
    - 1.0
    - 0.5
    - 0.25
    - 0.125
augment:
  vertical_flip: false
  horizontal_flip: true
  pipeline:
  - name: random_scale
    range:
    - 0.75
    - 1.35
    axis: both
    p: 0.5
  - name: random_anisotropic_scale
    axial:
    - 0.7
    - 1.4
    lateral:
    - 0.8
    - 1.25
    p: 0.4
  - name: random_rotate
    degrees: 8
    p: 0.3
  - name: random_translate
    frac: 0.1
    p: 0.3
  - name: elastic
    alpha: 25
    sigma: 6
    p: 0.2
  - name: gamma
    range:
    - 0.6
    - 1.7
    p: 0.5
  - name: brightness_contrast
    brightness: 0.25
    contrast: 0.3
    p: 0.5
  - name: gaussian_noise
    sigma:
    - 0
    - 0.12
    p: 0.35
  - name: speckle_noise
    sigma:
    - 0
    - 0.15
    p: 0.35
  - name: gaussian_blur
    sigma:
    - 0
    - 1.2
    p: 0.25
  - name: sharpen
    p: 0.15
  - name: low_res_simulation
    scale:
    - 0.5
    - 1.0
    p: 0.25
postproc:
  enforce_monotonic_columns: true
  allow_class_skips: true
  remove_small_islands: false
  min_island_frac: 0.0001
  min_island_floor: 2
  presence_gate:
    enabled: true
    min_pixel_frac: 0.0005
    min_pixels_floor: 32
    min_mean_conf: 0.5
    protected_classes:
    - 0
    - 9
  never_invent_classes: true
eval:
  tune_select_metric: none
model:
  name: vit_fpn
  params:
    backbone: samvit_large_patch16.sa1b
    patch_size: 16
    in_channels: 1
    out_channels: 10
    indices:
    - 5
    - 11
    - 17
    - 23
    dim: 256
    encoder_weights: ${OCTTTA_CKPT}/e08/sam_l_offtheshelf.pt
    pretrained: false
    deep_supervision: true
    encoder_window_size: 16
experiment:
  id: s33_sam_phase1
failaug:
  enabled: true
  mode: gwarp
  p: 0.3
  extreme_frac: 0.1666
  gwarp:
    shift_frac:
    - 0.04
    - 0.3
    shift_frac_extreme:
    - 0.3
    - 0.45
    squeeze_frac:
    - 0.03
    - 0.2
    squeeze_frac_extreme:
    - 0.2
    - 0.3
